# B0+lt (f47_tr4f_s_pq_cw_np_itl_lt_t90): the session scheduler's first example policy.
# Per-class busy thresholds (priority skips the busy queue), the session scheduler gate with aging lobby order,
# ITL-judged attainment, honest Retry-After estimates, the prefill budget and the standard-class target loop,
# and forecast placement on the DeepSeek-V4-Pro TP4 B300 step table (lower-tier hits on).
# Sized for 4 workers with 323 GB of host KV each: dram_tokens_per_worker = 323e9 / 4444 bytes per token.
# engine_priority maps each class to routing.priority, which the mocker maps back to the engine's class
# (mocker --engine-priority with the same map, --class-scheduling class_scheduling.json).
# kv_actions are offline-replay only (the live router ignores them).
default_policy_class: standard
policy_classes:
- name: priority
  quantum: 8
  prefill_busy_threshold_frac: 4.0
- name: standard
  quantum: 4
  prefill_busy_threshold_frac: 0.95
- name: batch
  quantum: 1
  prefill_busy_threshold_frac: 0.85
request_classifier:
  type: session-scheduler
  parameters:
    mode: enforce
    default_class: standard
    classes:
    - name: priority
      rank: 1
      value: 2.0
      service_level:
        ttft_s: 3.0
        itl_s: 0.05
        percentile: 0.9
        attainment: 0.9
        window_s: 60.0
      admission:
        gate_share: 1.0
        max_lobby_wait_s: 25.0
        on_wait_limit: expire
        shed_hold_s: 0.0
    - name: standard
      rank: 2
      value: 1.0
      service_level:
        ttft_s: 8.0
        itl_s: 0.1
        percentile: 0.9
        attainment: 0.7
        window_s: 60.0
      admission:
        gate_share: 0.9
        max_lobby_wait_s: 55.0
        on_wait_limit: expire
        shed_hold_s: 10.0
    - name: batch
      rank: 3
      value: 0.5
      admission:
        gate_share: 0.75
        max_lobby_wait_s: 290.0
        on_wait_limit: expire
        shed_hold_s: 120.0
    admission:
      lobby_order: aging
      judge_itl: true
      retry_after_estimate:
        estimate_window_waits: 20
        count_ends: true
        max_s: 120
        fallback_s: 30
        min_s: 10
      prefill_budget:
        margin: 0.9
        window_s: 30
        place_onboard: true
        lookahead_step_s: 10
      target_loop:
        class: standard
        margin: 0.03
        guard: 0.0
        guard_gain: 0.5
        gain: 0.5
        up_factor: 0.5
        step_s: 30
        smooth_s: 600
        min_scale: 0.6
        max_scale: 1.5
        infeasible_after_s: 600
        infeasible_hold: false
        reprobe_s: 900
        priority_wait_cut: 0.5
      hot_demand: next_turn
      dram_tokens_per_worker: 72682268
      dram_write_through: true
